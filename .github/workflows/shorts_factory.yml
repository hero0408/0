name: Video Generation Automated Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # 매일 정해진 시간에 자동 실행 (필요에 따라 조정)
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 허용

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check API Keys Existence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
        run: |
          python -c "
          import os
          keys = ['GEMINI_API_KEY', 'ELEVENLABS_API_KEY', 'FISH_AUDIO_API_KEY', 'KLING_API_KEY', 'MINIMAX_API_KEY', 'LUMA_API_KEY', 'RUNWAY_API_KEY']
          print('=== [Secrets 주입 상태 점검] ===')
          for k in keys:
              status = 'LOADED' if os.environ.get(k) else 'MISSING'
              print(f'{k}: {status}')
          "

      - name: Run Main Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python main.py
