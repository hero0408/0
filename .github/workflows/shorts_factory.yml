name: 24/7 Shorts Factory Bot

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 정오(KST) 자동 실행
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 3.11 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Node.js 18 설치 (yt-dlp JS 해독 엔진)
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: 시스템 필수 패키지 설치 (FFmpeg 및 나눔고딕 폰트)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-nanum

    - name: 파이썬 라이브러리 설치 및 yt-dlp 최신화
      run: |
        python -m pip install --upgrade pip
        pip install google-genai edge-tts yt-dlp moviepy pillow requests

    - name: 쇼츠 영상 자동 제작 및 유튜브 업로드
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: python main.py
