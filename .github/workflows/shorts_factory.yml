name: Clockwork Time Repository Automation Pipeline

on:
  workflow_dispatch: # GitHub Actions 탭에서 수동 실행 가능
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 UTC 00:00 (한국 시간 오전 9시) 자동 실행

jobs:
  build-render-and-upload:
    runs-on: ubuntu-latest

    steps:
    # 1. 레포지토리 코드 체크아웃
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Python 3.10 환경 및 pip 캐시 설정
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. 우분투 우분투 시스템 리소스 패키지(FFmpeg) 설치
    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 4. 파이썬 종속성 패키지 설치
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. 애니메이션 생성 및 유튜브 비공개 자동 업로드 파이프라인 실행
    - name: Run Animation Generation & Upload Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python main.py

    # 6. 생성된 최종 영상 및 메타데이터 결과물 백업 저장
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: always() # 실패하더라도 생성된 로그/파일 확인 가능하도록 설정
      with:
        name: output-video-artifacts
        path: |
          output_*.mp4
          metadata.json
